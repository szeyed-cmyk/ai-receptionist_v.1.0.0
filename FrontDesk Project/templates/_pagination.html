{% if pages > 1 %}<nav class="pagination" aria-label="Pagination">{% if page > 1 %}<a href="?page={{page-1}}{% if status %}&status={{status|urlencode}}{%endif%}{%if q%}&q={{q|urlencode}}{%endif%}">Previous</a>{%endif%}<span class="text-slate-500">Page {{page}} of {{pages}}</span>{% if page < pages %}<a href="?page={{page+1}}{%if status%}&status={{status|urlencode}}{%endif%}{%if q%}&q={{q|urlencode}}{%endif%}">Next</a>{%endif%}</nav>{% endif %}
