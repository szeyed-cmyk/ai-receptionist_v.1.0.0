{% extends "base.html" %}{% block title %}Edit knowledge · FrontDesk AI{% endblock %}{% block heading %}Edit knowledge answer{% endblock %}{%block subheading%}Update the information your receptionist shares.{%endblock%}{% block content %}<a href="/admin/knowledge" class="text-xs text-brand-600">← Back to knowledge base</a><form method="post" class="card max-w-3xl p-6 mt-5 space-y-5"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><div><label class="label" for="question">Customer question</label><input class="input" id="question" name="question" value="{{item.question}}" maxlength="500" required></div><div><label class="label" for="answer">Answer</label><textarea class="input" id="answer" name="answer" rows="7" required>{{item.answer}}</textarea></div><div><label class="label" for="category">Category</label><input class="input" id="category" name="category" value="{{item.category}}" maxlength="100" required></div><label class="flex items-center gap-3 text-sm"><input type="checkbox" name="is_active" value="true" {%if item.is_active%}checked{%endif%} class="w-4 h-4 accent-brand-500">Make this answer active</label><div class="flex gap-3"><button class="btn-primary">Save changes</button><a href="/admin/knowledge" class="btn-secondary">Cancel</a></div></form><form method="post" action="/admin/knowledge/{{item.id}}/delete" class="max-w-3xl mt-5" onsubmit="return confirm('Delete this knowledge answer?')"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><button class="text-xs text-rose-600 font-medium">Delete this answer</button></form>{%endblock%}
